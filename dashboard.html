<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="supabase-url" content="SUPABASE_URL_PLACEHOLDER" />
  <meta name="supabase-anon-key" content="SUPABASE_ANON_KEY_PLACEHOLDER" />
  <title>Your Letters | Insurance Claim Response Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f1e35;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }
    .top-bar {
      background: #0f1e35;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .top-bar strong {
      font-family: Georgia, serif;
      font-size: 1.15rem;
    }
    .top-bar nav a {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 0.9rem;
      margin-left: 1rem;
    }
    .top-bar nav a:hover { color: #fff; }
    .top-bar .btn-review {
      background: #0f1e35;
      color: #fff;
      border: 2px solid #fff;
      border-radius: 6px;
      padding: 0.45rem 1rem;
      font-size: 0.875rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }
    .shell { max-width: 900px; margin: 0 auto; padding: 2rem 1.25rem; }
    h1 {
      font-family: Georgia, serif;
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    .sub { color: #94a3b8; font-size: 0.9rem; margin-bottom: 2rem; }
    .letter-card {
      background: #fff;
      color: #1f2937;
      border-radius: 10px;
      padding: 1.1rem 1.25rem;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .letter-card .meta { flex: 1; min-width: 0; }
    .letter-card .meta strong {
      display: block;
      font-size: 1rem;
      color: #0f1e35;
      margin-bottom: 0.2rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .letter-card .meta span {
      font-size: 0.8rem;
      color: #6b7280;
    }
    .btn-view {
      background: #0f1e35;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.5rem 1.1rem;
      font-size: 0.875rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-no-letter {
      background: #e5e7eb;
      color: #6b7280;
      border: none;
      border-radius: 6px;
      padding: 0.5rem 1.1rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: default;
      white-space: nowrap;
    }
    .empty {
      text-align: center;
      padding: 3rem 1rem;
      color: #94a3b8;
    }
    .empty a {
      color: #60a5fa;
      text-decoration: none;
      font-weight: 600;
    }

    /* Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
      overflow-y: auto;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #fff;
      color: #1f2937;
      border-radius: 12px;
      width: 100%;
      max-width: 780px;
      padding: 2rem;
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: #e5e7eb;
      border: none;
      border-radius: 6px;
      padding: 0.35rem 0.75rem;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.875rem;
    }
    .modal h2 {
      font-family: Georgia, serif;
      font-size: 1.25rem;
      margin-bottom: 1.25rem;
      color: #0f1e35;
      padding-right: 3rem;
    }
    .modal-section {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .modal-section h4 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #6b7280;
      margin-bottom: 0.5rem;
    }
    .modal-section p {
      font-size: 0.9rem;
      color: #374151;
      line-height: 1.55;
    }
    .letter-text {
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      line-height: 1.55;
      white-space: pre-wrap;
      color: #111;
      max-height: 420px;
      overflow-y: auto;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 1rem;
    }
    .letter-text:not(.letter-text-plain) {
      font-family: Georgia, 'Times New Roman', serif;
      white-space: normal;
    }
    .modal-letter-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.65rem;
    }
    .modal-letter-head h4 { margin-bottom: 0; }
    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .btn-export {
      background: #f1f5f9;
      color: #0f1e35;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 0.4rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-export:hover:not(:disabled) { background: #e2e8f0; }
    .btn-export:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <strong>Insurance Claim Response Pro</strong>
    <nav>
      <a href="/claim-defense.html" class="btn-review">Review Another Notice</a>
      <a href="/dashboard.html">Dashboard</a>
      <a href="#" id="btnSignOut">Log in</a>
    </nav>
  </header>

  <div class="shell">
    <h1>Your letters</h1>
    <p class="sub">Letters you generate in the wizard appear here.</p>
    <div id="lettersList">
      <p style="color:#94a3b8;">Loading…</p>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <button class="modal-close" id="modalClose">Close</button>
      <h2 id="modalTitle">Letter</h2>
      <div class="modal-section">
        <h4>Analysis summary</h4>
        <p id="modalAnalysis">—</p>
      </div>
      <div class="modal-section">
        <h4>Strategy</h4>
        <p id="modalStrategy">—</p>
      </div>
      <div class="modal-section">
        <div class="modal-letter-head">
          <h4>Letter</h4>
          <div class="modal-actions">
            <button type="button" class="btn-export" id="btnCopyLetter" disabled>Copy</button>
            <button type="button" class="btn-export" id="btnPdfLetter" disabled>Download PDF</button>
            <button type="button" class="btn-export" id="btnWordLetter" disabled>Download Word</button>
          </div>
        </div>
        <div class="letter-text letter-text-plain" id="modalLetter"></div>
      </div>
    </div>
  </div>

  <script type="module">
    const urlMeta = document.querySelector('meta[name="supabase-url"]')
      ?.content?.trim() || '';
    const keyMeta = document.querySelector('meta[name="supabase-anon-key"]')
      ?.content?.trim() || '';

    if (!urlMeta || urlMeta.includes('PLACEHOLDER')) {
      document.getElementById('lettersList').innerHTML =
        '<p style="color:#f87171;">Configuration error. Please contact support.</p>';
      throw new Error('Supabase not configured');
    }

    const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
    const supabase = createClient(urlMeta, keyMeta);

    // Auth check
    const { data: { user }, error: userErr } = await supabase.auth.getUser();
    if (userErr || !user) {
      window.location.href = '/login.html?redirect='
        + encodeURIComponent('/dashboard.html');
      throw new Error('Not authenticated');
    }

    // Update nav
    const btnSignOut = document.getElementById('btnSignOut');
    btnSignOut.textContent = 'Log out';
    btnSignOut.addEventListener('click', async (e) => {
      e.preventDefault();
      await supabase.auth.signOut();
      window.location.href = '/login.html';
    });

    let currentModalJob = null;

    function htmlToPlainText(html) {
      if (!html || !String(html).trim()) return '';
      const d = document.createElement('div');
      d.innerHTML = html;
      return d.innerText.replace(/\u00a0/g, ' ').trim();
    }

    function slugFilename(title) {
      const s = String(title || 'claim-letter')
        .replace(/[^\w\s-]/g, '')
        .trim()
        .replace(/\s+/g, '-');
      return (s || 'claim-letter').slice(0, 80);
    }

    function setExportButtonLabels() {
      document.getElementById('btnCopyLetter').textContent = 'Copy';
      document.getElementById('btnPdfLetter').textContent = 'Download PDF';
      document.getElementById('btnWordLetter').textContent = 'Download Word';
    }

    async function downloadLetterPdf(plainText, filenameBase) {
      const { jsPDF } = await import('https://esm.sh/jspdf@2.5.2');
      const doc = new jsPDF({ unit: 'pt', format: 'letter' });
      const margin = 48;
      const pageWidth = doc.internal.pageSize.getWidth() - 2 * margin;
      const text = plainText || '(empty letter)';
      const lines = doc.splitTextToSize(text, pageWidth);
      let y = margin;
      const lineHeight = 14;
      const pageHeight = doc.internal.pageSize.getHeight();
      for (let i = 0; i < lines.length; i++) {
        if (y + lineHeight > pageHeight - margin) {
          doc.addPage();
          y = margin;
        }
        doc.text(lines[i], margin, y);
        y += lineHeight;
      }
      doc.save(`${filenameBase}.pdf`);
    }

    function downloadLetterWord(letterHtml, plainText, docTitle, filenameBase) {
      const inner = letterHtml && letterHtml.trim()
        ? `<div style="font-family:Calibri, sans-serif; font-size:11pt;">${letterHtml}</div>`
        : `<pre style="white-space:pre-wrap;font-family:Calibri;font-size:11pt;">${escapeHtml(plainText || '')}</pre>`;
      const safeTitle = escapeHtml(docTitle || 'Letter');
      const html = `<!DOCTYPE html><html xmlns:o="urn:schemas-microsoft-com:office:office"><head><meta charset="utf-8"><title>${safeTitle}</title></head><body>${inner}</body></html>`;
      const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${filenameBase}.doc`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    document.getElementById('btnCopyLetter').addEventListener('click', async () => {
      const job = currentModalJob;
      if (!job?.letter_html) return;
      const plain = htmlToPlainText(job.letter_html);
      const btn = document.getElementById('btnCopyLetter');
      try {
        await navigator.clipboard.writeText(plain);
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = 'Copy'; }, 2000);
      } catch {
        try {
          const ta = document.createElement('textarea');
          ta.value = plain;
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          btn.textContent = 'Copied!';
          setTimeout(() => { btn.textContent = 'Copy'; }, 2000);
        } catch {
          btn.textContent = 'Copy failed';
          setTimeout(() => { btn.textContent = 'Copy'; }, 2000);
        }
      }
    });

    document.getElementById('btnPdfLetter').addEventListener('click', async () => {
      const job = currentModalJob;
      if (!job?.letter_html) return;
      const btn = document.getElementById('btnPdfLetter');
      const plain = htmlToPlainText(job.letter_html);
      const title = job.payer_name || job.claim_type || 'Claim';
      const base = slugFilename(title);
      btn.disabled = true;
      btn.textContent = 'Building…';
      try {
        await downloadLetterPdf(plain, base);
      } catch (e) {
        console.warn('PDF export:', e);
        alert('Could not build PDF. Try Copy or Word export.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Download PDF';
      }
    });

    document.getElementById('btnWordLetter').addEventListener('click', () => {
      const job = currentModalJob;
      if (!job?.letter_html) return;
      const title = job.payer_name || job.claim_type || 'Letter';
      const base = slugFilename(title);
      const plain = htmlToPlainText(job.letter_html);
      downloadLetterWord(job.letter_html, plain, title, base);
    });

    // Load letters from claim_jobs
    const { data: jobs, error: jobsErr } = await supabase
      .from('claim_jobs')
      .select('id, created_at, claim_type, payer_name, letter_html, letter_full, selected_strategy, paid, is_unlocked')
      .eq('user_id', user.id)
      .order('created_at', { ascending: false });

    const container = document.getElementById('lettersList');

    if (jobsErr) {
      container.innerHTML = '<p style="color:#f87171;">Failed to load letters.</p>';
    } else if (!jobs || jobs.length === 0) {
      container.innerHTML = `
        <div class="empty">
          <p>No letters yet.</p>
          <p style="margin-top:0.5rem;">
            <a href="/claim-defense.html">Start your first claim response →</a>
          </p>
        </div>`;
    } else {
      container.innerHTML = jobs.map(job => {
        const title = job.payer_name || job.claim_type || 'Claim';
        const date = new Date(job.created_at).toLocaleDateString('en-US', {
          month: 'short', day: 'numeric', year: 'numeric',
          hour: 'numeric', minute: '2-digit'
        });
        const hasLetter = !!job.letter_html;
        const statusLabel = job.paid || job.is_unlocked ? 'Paid' : 'In progress';
        return `
          <div class="letter-card">
            <div class="meta">
              <strong>${escapeHtml(title)}</strong>
              <span>${statusLabel} &nbsp;·&nbsp; ${date}</span>
            </div>
            ${hasLetter
              ? `<button class="btn-view" data-id="${job.id}">View letter</button>`
              : `<button class="btn-no-letter" disabled>Letter not saved yet</button>`
            }
          </div>`;
      }).join('');

      // Wire view buttons
      container.querySelectorAll('.btn-view').forEach(btn => {
        btn.addEventListener('click', () => {
          const jobId = btn.dataset.id;
          const job = jobs.find(j => j.id === jobId);
          if (!job) return;
          openModal(job);
        });
      });
    }

    function openModal(job) {
      currentModalJob = job;
      setExportButtonLabels();

      const title = job.payer_name || job.claim_type || 'Claim';
      document.getElementById('modalTitle').textContent = title;

      // Analysis summary
      let analysisSummary = '—';
      if (job.letter_full) {
        try {
          const parsed = typeof job.letter_full === 'string'
            ? JSON.parse(job.letter_full)
            : job.letter_full;
          analysisSummary = parsed.plainEnglish
            || parsed.summary
            || parsed.whatInsuranceIsSaying
            || JSON.stringify(parsed).slice(0, 300);
        } catch {
          analysisSummary = String(job.letter_full).slice(0, 300);
        }
      }
      document.getElementById('modalAnalysis').textContent = analysisSummary;

      // Strategy
      document.getElementById('modalStrategy').textContent =
        job.selected_strategy || '—';

      // Letter — HTML when present for readability; plain styling fallback
      const letterEl = document.getElementById('modalLetter');
      const raw = job.letter_html || '';
      const hasLetter = !!raw.trim();
      letterEl.classList.toggle('letter-text-plain', !raw.includes('<'));
      if (raw.includes('<')) {
        letterEl.innerHTML = raw;
      } else {
        letterEl.textContent = raw || 'No letter saved.';
      }

      const copyBtn = document.getElementById('btnCopyLetter');
      const pdfBtn = document.getElementById('btnPdfLetter');
      const wordBtn = document.getElementById('btnWordLetter');
      copyBtn.disabled = !hasLetter;
      pdfBtn.disabled = !hasLetter;
      wordBtn.disabled = !hasLetter;

      document.getElementById('modalBackdrop').classList.add('open');
    }

    document.getElementById('modalClose').addEventListener('click', () => {
      document.getElementById('modalBackdrop').classList.remove('open');
      currentModalJob = null;
      setExportButtonLabels();
    });
    document.getElementById('modalBackdrop').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) {
        document.getElementById('modalBackdrop').classList.remove('open');
        currentModalJob = null;
        setExportButtonLabels();
      }
    });

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }
  </script>
</body>
</html>
